user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    # Request metadata only; omit query strings, headers, and bodies.
    # The upstream request ID matches the Node.js completion log.
    log_format api_json escape=json
        '{"time":"$time_iso8601","request_id":"$upstream_http_x_request_id",'
        '"method":"$request_method","status":$status,'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time"}';
    access_log /var/log/nginx/access.log api_json;

    server {
        listen 80 default_server;
        server_name _;
        client_max_body_size 1m;

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}
